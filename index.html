<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisab</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1525">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{--bg:#0e1525;--s1:#161f33;--s2:#1d2942;--bd:#2a3a5c;--tx:#e8edf7;--mu:#8fa0bd;--ac:#4f8cff;--ac2:#2f6fe0;--ok:#34c789;--wn:#f0b429;--er:#f2655a;--hdr:58px;color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:hidden}
  body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  body.has-tabs{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  h1,h2,h3{margin:0}
  h2{font-size:17px;margin-bottom:10px}
  h3{font-size:14px;margin:16px 0 8px;color:var(--mu);font-weight:600;letter-spacing:.2px}
  .sub{font-size:12px;color:var(--mu)}
  /* header */
  #hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;height:var(--hdr);padding:0 14px;padding-top:env(safe-area-inset-top);background:rgba(14,21,37,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd)}
  #hdr h1{font-size:19px;line-height:1.2}
  #hdr .ht{min-width:0;flex:1}
  #hdr .ht .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
  .ico{width:22px;height:22px}
  main{max-width:880px;margin:0 auto;padding:14px}
  /* drawer */
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  #drawer{position:fixed;top:0;bottom:0;left:0;width:min(290px,84vw);background:var(--s1);border-right:1px solid var(--bd);transform:translateX(-102%);transition:transform .22s;z-index:50;padding:calc(18px + env(safe-area-inset-top)) 12px 18px;display:flex;flex-direction:column;gap:4px}
  body.drawer-open #scrim{opacity:1;pointer-events:auto}
  body.drawer-open #drawer{transform:none}
  #drawer .brand{font-size:18px;font-weight:700;padding:4px 10px 14px}
  #drawer button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--mu);font-size:15px;padding:12px 10px;border-radius:10px;font-family:inherit}
  #drawer button.on{background:var(--s2);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
  #drawer button.on .ico{color:var(--ac)}
  /* contextual tabs: bottom on phones, strip under the header on larger screens */
  #ctabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;overflow-x:auto;background:var(--s1);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom));scrollbar-width:none}
  #ctabs::-webkit-scrollbar{display:none}
  #ctabs button{flex:0 0 auto;min-width:78px;padding:10px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--s2);color:var(--mu);font-size:14px;font-weight:600;font-family:inherit;white-space:nowrap}
  #ctabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
  @media(min-width:768px){
    #ctabs{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top));bottom:auto;border-top:0;border-bottom:1px solid var(--bd);padding:10px 14px;justify-content:flex-start}
    body.has-tabs{padding-bottom:24px}
  }
  /* cards and forms */
  .card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px}
  input,select{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit}
  input:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
  button{font-family:inherit;font-size:15px;padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
  button.full{width:100%;margin-top:14px}
  button.sm{font-size:13px;padding:7px 11px;margin:8px 8px 0 0}
  button.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}
  button.danger{background:var(--er)}
  button:disabled{opacity:.55}
  .seg{display:flex;gap:8px}.seg button{flex:1;background:var(--s2);color:var(--mu);border:1px solid var(--bd)}.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
  .big{font-size:28px;font-weight:800;letter-spacing:-.3px}
  .track{background:var(--s2);border-radius:6px;height:10px;overflow:hidden;margin:7px 0}
  .fill{height:100%;border-radius:6px}
  .g{background:var(--ok)}.a{background:var(--wn)}.r{background:var(--er)}
  .t-g{color:var(--ok)}.t-r{color:var(--er)}.t-a{color:var(--wn)}
  .row{margin:12px 0}.rowtop{display:flex;justify-content:space-between;font-size:14px;gap:8px}
  .ins{font-size:14px;padding:10px 12px;border-radius:10px;margin:7px 0;border:1px solid transparent}
  .ins.bad{background:rgba(242,101,90,.12);border-color:rgba(242,101,90,.35);color:#ffb3ad}
  .ins.warn{background:rgba(240,180,41,.12);border-color:rgba(240,180,41,.35);color:#f7d98a}
  .ins.ok{background:rgba(52,199,137,.12);border-color:rgba(52,199,137,.35);color:#9be6c4}
  .ins.info{background:var(--s2);border-color:var(--bd);color:var(--mu)}
  .banner{padding:13px 14px;border-radius:12px;margin-bottom:12px;font-weight:700;font-size:15px;border:1px solid}
  .banner.g{background:rgba(52,199,137,.12);border-color:rgba(52,199,137,.4);color:#9be6c4}
  .banner.r{background:rgba(242,101,90,.12);border-color:rgba(242,101,90,.4);color:#ffb3ad}
  .ent{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd);font-size:14px}
  .ent:last-child{border-bottom:0}.ent .l{min-width:0;flex:1}.ent b{white-space:nowrap}
  .empty{padding:22px 10px;text-align:center;color:var(--mu);font-size:14px}
  details{border-top:1px solid var(--bd);padding:10px 0}summary{font-weight:700;font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px}
  .stat .lb{font-size:12px;color:var(--mu)}.stat .vl{font-size:21px;font-weight:800;margin:4px 0 2px;word-break:break-word}
  .range{display:grid;grid-template-columns:1fr;gap:8px}
  .range2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .legend{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
  .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  svg.chart{width:100%;height:auto;display:block}
  #bar{background:rgba(240,180,41,.14);border:1px solid rgba(240,180,41,.4);color:#f7d98a;padding:9px 12px;border-radius:10px;margin:12px 14px 0;font-size:13px;max-width:852px}
  #toast{position:fixed;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#fff;color:#111;padding:12px;border-radius:10px;font-size:14px;display:none;z-index:70;font-weight:600}
  #toast.err{background:var(--er);color:#fff}
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:60}
  #ov .sheet{background:var(--s1);border:1px solid var(--bd);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
  #hdr .brandbar{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.4px}
  #hdr .logo{width:28px;height:28px;border-radius:8px}
  .pagehead{margin:2px 0 14px}.pagehead h1{font-size:24px;line-height:1.2}.pagehead .sub{margin-top:3px;font-size:13px}
  .stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--s2);margin:8px 0}
  .stack div{height:100%}
  .chips{display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 6px}
  .chips span{font-size:12px;color:var(--mu);display:inline-flex;align-items:center;gap:5px}
  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 38%,#17284f 0%,#0e1525 68%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;transition:opacity .45s ease,visibility .45s}
  #splash.out{opacity:0;visibility:hidden}
  #splash svg{width:92px;height:92px}
  #splash .b{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow .6s cubic-bezier(.2,.9,.3,1.15) forwards}
  #splash .b1{animation-delay:.1s}#splash .b2{animation-delay:.25s}#splash .b3{animation-delay:.4s}
  #splash .word{font-size:42px;font-weight:800;letter-spacing:1.5px;opacity:0;transform:translateY(10px);animation:rise .6s .6s ease forwards}
  #splash .tag{color:var(--mu);font-size:14px;max-width:290px;opacity:0;animation:fade .7s 1s ease forwards}
  @keyframes grow{to{transform:scaleY(1)}}@keyframes rise{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}
  @media(prefers-reduced-motion:reduce){#splash .b,#splash .word,#splash .tag{animation:none;opacity:1;transform:none}}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
  .badge.bg{color:#9be6c4;border-color:rgba(52,199,137,.5);background:rgba(52,199,137,.1)}
  .badge.ba{color:#f7d98a;border-color:rgba(240,180,41,.5);background:rgba(240,180,41,.1)}
  .badge.br{color:#ffb3ad;border-color:rgba(242,101,90,.5);background:rgba(242,101,90,.1)}
  .pills{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--s2);color:var(--mu);font-size:13px;font-weight:600}
  .pill.on{background:var(--ac);border-color:var(--ac);color:#fff}
  .gt{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px;align-items:center}
  .gt span:not(:first-child){text-align:right}.gt span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .gt.head{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .gt.tot{font-weight:800;border-bottom:0}
  .gt.c5{grid-template-columns:1.2fr repeat(4,1fr);font-size:12px}
  .gx{cursor:pointer}.gx:active{background:var(--s2)}
  #wiz{position:fixed;inset:0;background:var(--bg);z-index:80;display:none;flex-direction:column}
  .wz-head{display:flex;align-items:center;gap:12px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--bd);background:var(--s1)}
  .wz-prog{display:flex;gap:5px;padding:10px 14px 0;max-width:588px;width:100%;margin:0 auto}.wz-prog i{flex:1;height:4px;border-radius:2px;background:var(--s2)}.wz-prog i.on{background:var(--ac)}
  .wz-body{flex:1;overflow-y:auto;padding:14px;width:100%;max-width:588px;margin:0 auto}
  .wz-foot{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--s1)}
  .wz-foot>div{display:flex;gap:10px;max-width:560px;margin:0 auto}.wz-foot button{flex:1}
  .prow{display:grid;grid-template-columns:1fr 112px 38px;gap:8px;margin-bottom:8px;align-items:center}
  .xbtn{width:38px;height:44px;padding:0;background:var(--s2);color:var(--er);border:1px solid var(--bd);font-size:18px}
  .chk{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--s1);font-size:15px;margin-top:0}
  .chk input{width:20px;height:20px;flex:none;margin:0}
  #view.in{animation:vin .22s ease}
  @keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .iconbtn.spinning svg{animation:spin .8s linear infinite}
  #lock{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 30%,#17284f 0%,#0e1525 70%);display:flex;align-items:center;justify-content:center;overflow:auto}
  .lk-in{width:100%;max-width:340px;padding:24px;text-align:center}
  .lk-in .logo{width:60px;height:60px;border-radius:15px;margin-bottom:12px}
  .lk-title{font-size:22px;font-weight:800;margin-bottom:4px}
  .lk-dots{display:flex;gap:12px;justify-content:center;margin:20px 0 8px}
  .lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mu)}.lk-dots i.on{background:var(--ac);border-color:var(--ac)}
  .lk-msg{min-height:34px;font-size:13px;color:#ffb3ad;margin-bottom:6px}
  .lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:264px;margin:0 auto}
  .lk-pad button{height:64px;border-radius:50%;font-size:24px;background:var(--s1);border:1px solid var(--bd);color:var(--tx);font-weight:600;padding:0}
  .lk-pad button:active{background:var(--s2)}
  .lk-forgot{background:none;color:var(--mu);margin-top:18px;font-size:13px;font-weight:600}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 84 84"><rect class="b b1" x="12" y="44" width="16" height="28" rx="4" fill="#8FB4FF"/><rect class="b b2" x="34" y="28" width="16" height="44" rx="4" fill="#8FB4FF"/><rect class="b b3" x="56" y="12" width="16" height="60" rx="4" fill="#34c789"/></svg>
  <div class="word">Hisab</div>
  <div class="tag">Plan together. Spend wisely.</div>
</div>
<header id="hdr">
  <button class="iconbtn" id="menuBtn" aria-label="Menu" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brandbar"><img class="logo" src="icon-192.png" alt=""><span>Hisab</span></div>
  <button class="iconbtn" id="refreshBtn" style="margin-left:auto" aria-label="Refresh"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
</header>
<nav id="ctabs" class="hide" aria-label="Section options"></nav>
<div id="bar" class="hide"></div>
<main id="main">
  <div class="pagehead"><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
  <div id="boot" class="sub">Loading...</div>
  <div id="view"></div>
</main>
<div id="scrim"></div>
<aside id="drawer" aria-label="Main menu"></aside>
<div id="wiz" role="dialog" aria-modal="true"></div>
<div id="lock" class="hide" role="dialog" aria-modal="true" aria-label="App lock"></div>
<div id="toast"></div>
<div id="ov"><div class="sheet" id="sheet"></div></div>

<!-- The add form lives here when not shown; it is moved into the active page so there is only one copy -->
<div id="addHost" class="hide">
  <div class="card" id="addCard">
    <div class="seg" id="typeSeg"><button id="tExp" class="on">Expense</button><button id="tInc">Income</button></div>
    <label>Date</label><input type="date" id="date">
    <div id="catWrap"><label>Category</label><select id="cat"></select></div>
    <div id="srcWrap" class="hide"><label>Source</label><input type="text" id="src" placeholder="e.g. bonus, side work"></div>
    <div id="detWrap"><label>Detail</label><input type="text" id="detail" placeholder="e.g. lunch, fuel"></div>
    <label>Amount</label><input type="number" id="amt" inputmode="decimal" step="any" placeholder="0">
    <button class="full" id="save">Save</button>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwpmfqGZFpUqhpjcO81t15dHwehJzs7lLw_qM6zymBSRx-NmFXt2ehMrwRmaoVy8VpY/exec';
let KEY = localStorage.getItem('bk') || '';
let LOCK_RESET=false;
(function(){const q=new URLSearchParams(location.search);if(q.get('k')){KEY=q.get('k');localStorage.setItem('bk',KEY);history.replaceState(null,'',location.pathname);
  if(localStorage.getItem('pinh')){['pinh','pins','pinl','pinf'].forEach(k=>localStorage.removeItem(k));LOCK_RESET=true;}}})();
let ROLE='', OWNER=false, inited=false;
let S={categories:[],summary:null,goals:[],members:[],salaryDay:28,name:'',me:'',firstBudgetMonth:'',people:[],ledger:{people:[],open:[],settled:[]},fgoals:[],groups:{expenses:[],summary:{},history:[]}};
let type='expense', E={}, R=null;
let nav={sec:'dash',tabs:{exp:'add',inc:'add',split:'overview',fgoals:'active',ana:'overview'}};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function n(x){return Math.round(x).toLocaleString('en-US');}
function p2(x){return String(x).padStart(2,'0');}
function today(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function cls(p){return p>1?'r':(p>=0.8?'a':'g');}
function toast(m,bad){const t=$('toast');t.textContent=m;t.className=bad?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500);}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function u(y,m,d){return Math.round(Date.UTC(y,m-1,d)/864e5);}
function dn(s){const q=String(s).split('-').map(Number);return u(q[0],q[1],q[2]);}
function ds(x){const d=new Date(x*864e5);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());}
function fd(s){const q=String(s).split('-').map(Number);return q[2]+' '+MON[q[1]-1]+' '+q[0];}
function fds(s){const q=String(s).split('-').map(Number);return q[2]+' '+MON[q[1]-1];}

// ---------- network, offline queue
const Q_ACTIONS={addEntry:1,ledgerAdd:1};
function getQ(){try{return JSON.parse(localStorage.getItem('bq')||'[]');}catch(e){return [];}}
function setQ(q){localStorage.setItem('bq',JSON.stringify(q));updateBar();}
function uuid(){return (window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)).replace(/-/g,'').slice(0,32);}
function updateBar(){
  const q=getQ().length,off=!navigator.onLine,b=$('bar');
  if(!q&&!off){b.classList.add('hide');return;}
  b.classList.remove('hide');
  b.textContent=(off?'Offline. ':'')+(q?q+(q>1?' entries are':' entry is')+' waiting to sync.':'You can still add entries; they will sync later.');
}
function post(action,p){
  return fetch(API,{method:'POST',body:JSON.stringify({key:KEY,action:action,p:p})}).then(r=>r.json()).then(j=>{
    if(!j.ok){const e=new Error(j.error);e.server=true;throw e;}return j.data;});
}
function applyLocal(action,p){
  if(action==='addEntry'&&S.summary){
    const a=Number(p.amount),s=S.summary;
    if(p.type==='income'){s.income+=a;s.extraIncome+=a;s.left+=a;}
    else{s.totalSpent+=a;s.remaining-=a;s.left-=a;const c=s.categories.find(x=>x.name===p.category);if(c)c.spent+=a;}
  } else if(action==='ledgerAdd'&&S.ledger){
    S.ledger.open.unshift({id:'tmp'+p.cid,date:p.date||today(),debtor:p.debtor,creditor:p.creditor,amount:Number(p.amount),note:p.note||'',by:S.me});
  }
}
function enqueue(action,payload,ok){
  const q=getQ();q.push({action:action,payload:payload});setQ(q);
  applyLocal(action,payload);
  if(ok)ok({queued:true,msg:'Saved on this phone. Will sync when online.'});
}
let flushing=false;
function flush(){
  if(flushing||!KEY||!getQ().length)return;
  flushing=true;
  (function next(){
    const q=getQ();
    if(!q.length){flushing=false;updateBar();refresh();return;}
    post(q[0].action,q[0].payload).then(()=>{setQ(getQ().slice(1));next();})
      .catch(e=>{
        if(e.server){toast('Entry dropped: '+e.message,true);setQ(getQ().slice(1));next();}
        else{flushing=false;updateBar();}
      });
  })();
}
function refresh(){if(KEY&&!getQ().length)call('boot',{},init,null,'bc');}
function call(action,payload,ok,btn,cacheKey,onErr){
  payload=payload||{};
  const label=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Please wait…';}
  const done=()=>{if(btn){btn.disabled=false;btn.textContent=label;}};
  if(Q_ACTIONS[action]){
    payload.cid=uuid();
    if(getQ().length){enqueue(action,payload,ok);done();flush();return;}
    post(action,payload).then(r=>{done();if(ok)ok(r);})
      .catch(e=>{done();if(e.server){if(!(onErr&&onErr(e)))toast(e.message,true);}else enqueue(action,payload,ok);});
    return;
  }
  post(action,payload).then(r=>{done();if(cacheKey)localStorage.setItem(cacheKey,JSON.stringify(r));if(ok)ok(r);})
    .catch(e=>{
      done();
      if(e.server){if(!(onErr&&onErr(e)))toast(e.message,true);return;}
      const c=cacheKey&&localStorage.getItem(cacheKey);
      if(c){updateBar();if(ok)ok(JSON.parse(c),true);}
      else toast('No internet connection. Nothing was saved.',true);
    });
}
function animateView(){const vw=$('view');vw.classList.remove('in');void vw.offsetWidth;vw.classList.add('in');}
let refreshing=false;
$('refreshBtn').onclick=()=>{
  if(!KEY||refreshing)return;
  if(getQ().length){flush();toast('Syncing waiting entries…');return;}
  refreshing=true;$('refreshBtn').classList.add('spinning');
  call('boot',{},(r,cached)=>{refreshing=false;$('refreshBtn').classList.remove('spinning');init(r);toast(cached?'Offline: showing saved data':'Up to date');},null,'bc');
  setTimeout(()=>{refreshing=false;$('refreshBtn').classList.remove('spinning');},8000);
};

function othersOf(){
  const set=(S.people||[]).filter(p=>p!==S.me);
  ((S.ledger&&S.ledger.open)||[]).concat((S.ledger&&S.ledger.settled)||[]).forEach(e=>[e.debtor,e.creditor].forEach(x=>{if(x&&x!==S.me&&set.indexOf(x)<0)set.push(x);}));
  return set;
}
function pairNet(p){return ((S.ledger&&S.ledger.open)||[]).reduce((s,e)=>s+(e.creditor===S.me&&e.debtor===p?e.amount:0)-(e.debtor===S.me&&e.creditor===p?e.amount:0),0);}
function myNet(){return othersOf().reduce((s,p)=>s+pairNet(p),0);}
function familyPos(){
  const m={};(S.people||[]).forEach(p=>m[p]=0);
  S.ledger.open.forEach(e=>{m[e.creditor]=(m[e.creditor]||0)+e.amount;m[e.debtor]=(m[e.debtor]||0)-e.amount;});

// ---------- Group expenses (one bill, several payers, several sharers)
function fm(x){return Number(x||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});}
function nm(x){return x===S.me?'You':x;}
function nl(x){return x===S.me?'you':x;}
function verb(x,a,b){return x===S.me?a:b;}
function badge(st){return '<span class="badge '+(st==='Settled'?'bg':st==='Open'?'br':'ba')+'">'+(st==='Partial'?'Partly settled':st)+'</span>';}
function myBal(e){const b=e.balances.find(x=>x.person===S.me);return b?b.remaining:0;}
function posText(x){return x>0?'<span class="t-g">You are owed '+fm(x)+'</span>':x<0?'<span class="t-r">You owe '+fm(-x)+'</span>':'<span class="sub">Even</span>';}
function toC(x){const v=parseFloat(x);if(!isFinite(v))return NaN;const c=Math.round(v*100);return Math.abs(v*100-c)<1e-6?c:NaN;}
function pidx(p){const i=S.people.indexOf(p);return i<0?99:i;}
function eqShares(parts,T){
  const ord=parts.slice().sort((a,b)=>pidx(a)-pidx(b)),base=Math.floor(T/ord.length),extra=T-base*ord.length;
  return ord.map((p,i)=>({person:p,c:base+(i<extra?1:0)})).filter(x=>x.c>0);
}
function planC(rem){
  const cr=[],db=[];Object.keys(rem).forEach(k=>{if(rem[k]>0)cr.push({p:k,a:rem[k]});else if(rem[k]<0)db.push({p:k,a:-rem[k]});});
  const ord=(a,b)=>b.a-a.a||(a.p<b.p?-1:a.p>b.p?1:0);cr.sort(ord);db.sort(ord);
  const out=[];let i=0,j=0;
  while(i<cr.length&&j<db.length){const pay=Math.min(cr[i].a,db[j].a);out.push({from:db[j].p,to:cr[i].p,c:pay});cr[i].a-=pay;db[j].a-=pay;if(cr[i].a===0)i++;if(db[j].a===0)j++;}
  return out;
}

const WSTEPS=['Details','Participants','Who paid','Split','Review'];

  GW=e?{step:1,id:e.id,expectUpdated:e.updatedAt,cid:null,title:e.title,date:e.date,total:String(e.total),notes:e.notes||'',parts:e.shares.map(x=>x.person),

function wizClose(force){
  if(!force&&GW&&(GW.title||GW.total)&&!confirm('Discard this group expense?'))return;
  GW=null;$('wiz').style.display='none';$('wiz').innerHTML='';
}
function wzSortParts(){GW.parts.sort((a,b)=>pidx(a)-pidx(b));}
function wzErr(step){
  const T=toC(GW.total);
  if(!GW.title.trim())return 'Enter a title for the expense';
  if(!GW.date)return 'Pick a date';
  if(!(T>0))return 'Enter a total above 0 (up to 2 decimals)';
  if(step<2)return '';
  if(!GW.parts.length)return 'Pick at least one participant';
  if(step<3)return '';
  const seen={};let sum=0;
  for(const r of GW.payers){
    if(!r.person)return 'Choose who paid on every row';
    if(seen[r.person])return nm(r.person)+' is listed twice. Combine them into one row';
    seen[r.person]=1;
    const c=toC(r.amount);if(!(c>0))return 'Enter the amount paid by '+nm(r.person);
    sum+=c;
  }
  if(sum!==T)return 'Payments add up to '+fm(sum/100)+' but the total is '+fm(T/100);
  if(step<4)return '';
  if(GW.method==='custom'){
    let s2=0;for(const p of GW.parts){const c=toC(GW.shares[p]);if(!(c>0))return 'Enter the share of '+nm(p);s2+=c;}
    if(s2!==T)return 'Shares add up to '+fm(s2/100)+' but the total is '+fm(T/100);
  }
  if(!OWNER&&GW.parts.indexOf(S.me)<0&&!GW.payers.some(r=>r.person===S.me))return 'You can only add expenses that involve you';
  return '';
}
function wzFigures(){
  const T=toC(GW.total),paid={},share={};
  GW.payers.forEach(r=>{if(r.person)paid[r.person]=(paid[r.person]||0)+(toC(r.amount)||0);});
  if(GW.method==='equal'){if(T>0&&GW.parts.length)eqShares(GW.parts,T).forEach(x=>{share[x.person]=x.c;});}
  else GW.parts.forEach(p=>{share[p]=toC(GW.shares[p])||0;});
  const names=Array.from(new Set(Object.keys(paid).concat(Object.keys(share)))).sort((a,b)=>pidx(a)-pidx(b));
  return {T:T,paid:paid,share:share,names:names};
}

function wzUpdate(){
  const T=toC(GW.total);
  const p=$('wzPaid');
  if(p){let sum=0;GW.payers.forEach(r=>{sum+=toC(r.amount)||0;});const d=T-sum;
    p.className='ins '+(d===0?'ok':d>0?'warn':'bad');
    p.textContent=d===0?'Paid '+fm(sum/100)+' of '+fm(T/100)+'. Everything is covered.':d>0?'Paid '+fm(sum/100)+' of '+fm(T/100)+'. Still to assign: '+fm(d/100):'Paid '+fm(sum/100)+' of '+fm(T/100)+'. Excess: '+fm(-d/100);}
  const q=$('wzShare');
  if(q){let sum=0;GW.parts.forEach(x=>{sum+=toC(GW.shares[x])||0;});const d=T-sum;
    q.className='ins '+(d===0?'ok':d>0?'warn':'bad');
    q.textContent=d===0?'Shares add up to '+fm(sum/100)+'. Everything is covered.':d>0?'Shares add up to '+fm(sum/100)+' of '+fm(T/100)+'. Remaining: '+fm(d/100):'Shares add up to '+fm(sum/100)+' of '+fm(T/100)+'. Excess: '+fm(-d/100);}
}
function wzPayload(){

    payers:GW.payers.map(r=>({person:r.person,amount:Number(r.amount)}))};

$('wiz').addEventListener('click',ev=>{

  else if(a==='next'){const err=wzErr(GW.step);if(err)return toast(err,true);GW.step++;if(GW.step===4&&GW.method==='custom')GW.parts.forEach(p=>{if(GW.shares[p]==null)GW.shares[p]='';});wizRender();$('wiz').querySelector('.wz-body').scrollTop=0;}

// ---------- Analytics
const AN={preset:'month',cf:'',ct:'',data:null,key:'',cat:'',ents:null,stale:false,loading:false};
const PRESETS=[['week','This week'],['month','This month'],['lastmonth','Last month'],['3m','Last 3 months'],['6m','Last 6 months'],['year','This budget year'],['custom','Custom range']];
function cycOf(x,D){const q=ds(x).split('-').map(Number);let y=q[0],m=q[1];if(q[2]<D){m--;if(m<1){m=12;y--;}}return {cs:u(y,m,D),ce:u(y,m+1,D)};}
function cycBack(x,k,D){let c=cycOf(x,D);for(let i=0;i<k;i++)c=cycOf(c.cs-1,D);return c;}
// returns {from,to,prevFrom,prevTo,note} as day numbers, comparing the same number of elapsed days when the period is still running
function rangeFor(preset,D,cf,ct){
  const T=dn(today());
  const elapsed=(from,to)=>Math.min(to,T)-from+1;
  const mk=(from,to,pFrom,pCap,note)=>{const E2=elapsed(from,to);return {from:from,to:to,prevFrom:pFrom,prevTo:Math.min(pCap,pFrom+Math.max(E2,1)-1),note:note};};
  const salNote='Salary months run from the '+D+'th to the day before the next '+D+'th.';
  if(preset==='week'){const dow=new Date(T*864e5).getUTCDay();const mon=T-((dow+6)%7);return mk(mon,mon+6,mon-7,mon-1,'Calendar week, Monday to Sunday.');}
  if(preset==='month'){const c=cycOf(T,D),pc=cycBack(T,1,D);return mk(c.cs,c.ce-1,pc.cs,pc.ce-1,salNote);}
  if(preset==='lastmonth'){const c=cycBack(T,1,D),pc=cycBack(T,2,D);return mk(c.cs,c.ce-1,pc.cs,pc.ce-1,salNote);}
  if(preset==='3m'||preset==='6m'){const k=preset==='3m'?3:6;const c0=cycOf(T,D),cs=cycBack(T,k-1,D),pc=cycBack(T,2*k-1,D),pe=cycBack(T,k,D);return mk(cs.cs,c0.ce-1,pc.cs,pe.ce-1,salNote+' Includes the current salary month.');}
  if(preset==='year'){
    const ce=ds(cycOf(T,D).ce).split('-').map(Number),ly=ce[0],lm=ce[1];
    const q=(S.firstBudgetMonth||'').split('-').map(Number),fy=q[0]||ly,fm=q[1]||lm;
    const idx=Math.max(0,Math.floor(((ly-fy)*12+(lm-fm))/12)),sy=fy+idx,sm=fm;
    const endM=sm===1?12:sm-1,endY=sm===1?sy:sy+1;
    return mk(u(sy,sm-1,D),u(sy+1,sm-1,D)-1,u(sy-1,sm-1,D),u(sy,sm-1,D)-1,'Budget year '+MON[sm-1]+' '+sy+' to '+MON[endM-1]+' '+endY+' (salary months). It starts again by itself every year.');
  }
  if(!cf||!ct||ct<cf)return null;
  const from=dn(cf),to=dn(ct),L=Math.max(Math.min(to,T)-from+1,1);
  return {from:from,to:to,prevFrom:from-L,prevTo:from-1,note:'Custom calendar dates.'};
}
function anRange(){return rangeFor(AN.preset,S.salaryDay||28,AN.cf,AN.ct);}
function anKey(r){return [ds(r.from),ds(r.to),ds(r.prevFrom),ds(r.prevTo)].join('|');}
function loadAnalytics(){
  const r=anRange();if(!r){AN.data=null;render();return;}
  const key=anKey(r);AN.key=key;AN.ents=null;
  let cached=null;try{cached=JSON.parse(localStorage.getItem('an:'+key)||'null');}catch(e){}
  if(cached){AN.data=cached;AN.stale=true;render();}else{AN.data=null;AN.stale=false;AN.loading=true;render();}
  call('analytics',{from:ds(r.from),to:ds(r.to),prevFrom:ds(r.prevFrom),prevTo:ds(r.prevTo)},d=>{
    if(AN.key!==key)return;
    AN.data=d;AN.stale=false;AN.loading=false;
    try{
      localStorage.setItem('an:'+key,JSON.stringify(d));
      const ks=Object.keys(localStorage).filter(k=>k.indexOf('an:')===0);
      if(ks.length>8)ks.slice(0,ks.length-8).forEach(k=>localStorage.removeItem(k));
    }catch(e){}
    render();
  });
}
function pctTxt(x){return (x>0?'+':'')+Math.round(x*100)+'%';}
function deltaHtml(cur,prev,goodUp,hasPrev){
  if(!hasPrev)return '<span class="sub">No previous data</span>';
  if(prev===0&&cur===0)return '<span class="sub">Same as before</span>';
  if(prev===0)return '<span class="sub">New (nothing before)</span>';
  const d=(cur-prev)/Math.abs(prev);
  if(Math.abs(d)<0.005)return '<span class="sub">About the same</span>';
  const good=goodUp?d>0:d<0;
  return '<span class="'+(good?'t-g':'t-r')+'">'+(d>0?'▲ ':'▼ ')+pctTxt(Math.abs(d)).replace('+','')+' vs previous</span>';
}
function insightsFor(d){
  const out=[],t=d.totals,pv=d.prev,cats=d.categories,hasPrev=!!(pv&&pv.hasData);
  if(d.cycleFactor>=0.9){
    cats.filter(c=>c.budgetScaled>0).forEach(c=>{
      const r=c.spent/c.budgetScaled;
      if(r>1)out.push({type:'bad',w:3,text:c.name+' is over budget by '+n(c.spent-c.budgetScaled)+' ('+Math.round(r*100)+'% of budget used)'});
      else if(r>=0.8)out.push({type:'warn',w:2,text:'You are approaching your '+c.name+' budget ('+Math.round(r*100)+'% used)'});
    });
  }
  if(hasPrev&&pv.expenses>0){
    cats.forEach(c=>{
      if(c.prevSpent==null)return;
      const diff=c.spent-c.prevSpent;
      if(Math.abs(diff)<0.05*pv.expenses)return;
      if(c.prevSpent>0){const pc=diff/c.prevSpent;
        if(diff>0)out.push({type:'warn',w:2,text:'You spent '+Math.round(pc*100)+'% more on '+c.name+' than in the previous period (+'+n(diff)+')'});
        else out.push({type:'ok',w:1,text:'Your '+c.name+' spending decreased by '+Math.round(-pc*100)+'% ('+n(diff)+')'});
      } else if(diff>0)out.push({type:'warn',w:2,text:c.name+' spending is new this period ('+n(c.spent)+'), with none before'});
    });
    if(pv.income>0&&t.income>0){
      const dn2=t.net-pv.net;
      if(Math.abs(dn2)>=0.05*pv.income)out.push({type:dn2>0?'ok':'warn',w:2,text:'Your net savings '+(dn2>0?'increased':'decreased')+' by '+n(Math.abs(dn2))+' compared with the previous period'});
    }
  }
  const top=cats.slice().sort((a,b)=>b.spent-a.spent)[0];
  if(top&&top.spent>0&&t.expenses>0&&top.spent/t.expenses>=0.3)out.push({type:'info',w:0,text:top.name+' is '+Math.round(top.spent/t.expenses*100)+'% of your spending in this period'});
  if(!hasPrev)out.push({type:'info',w:0,text:'There is no data in the previous period to compare with.'});
  return out.sort((a,b)=>b.w-a.w).slice(0,6);
}
const PAL=['#4f8cff','#34c789','#f0b429','#f2655a','#a78bfa','#22d3ee','#fb923c','#f472b6','#84cc16','#94a3b8','#14b8a6','#e879f9','#c084fc'];

  return h;
}
function barsHtml(vals,labels,color){

  return h+'</svg>';
}
function budgetHtml(cats,factor){

}

// ---------- App lock: a PIN kept on this phone only (never sent to the server)
const PIN_ITER=150000;
let LOCKED=false,PINBUF='',hiddenAt=0;
function b64e(u8){let t='';for(let i=0;i<u8.length;i++)t+=String.fromCharCode(u8[i]);return btoa(t);}
function b64d(t){const r=atob(t),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
function lockOn(){return !!localStorage.getItem('pinh');}
function lockOK(){return !!(window.crypto&&crypto.subtle&&crypto.getRandomValues&&window.TextEncoder);}
async function pinHash(pin,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(salt),iterations:PIN_ITER,hash:'SHA-256'},k,256);
  return b64e(new Uint8Array(bits));
}
async function pinSet(pin){
  const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));
  localStorage.setItem('pins',salt);localStorage.setItem('pinl',String(pin.length));localStorage.setItem('pinh',await pinHash(pin,salt));localStorage.removeItem('pinf');
}
async function pinCheck(pin){return (await pinHash(pin,localStorage.getItem('pins')||''))===localStorage.getItem('pinh');}
function pinFail(){
  let f={n:0,until:0};try{f=JSON.parse(localStorage.getItem('pinf')||'')||f;}catch(e){}
  return f;
}
function lockWait(){const f=pinFail(),left=f.until-Date.now();return left>0?Math.ceil(left/1000):0;}
function renderLock(msg){
  const name=localStorage.getItem('bn'),len=Number(localStorage.getItem('pinl'))||4;
  $('lock').innerHTML='<div class="lk-in"><img class="logo" src="icon-192.png" alt=""><div class="lk-title">'+(name?'Welcome back, '+esc(name):'Welcome back')+'</div><div class="sub">Enter your PIN to open Hisab</div>'+
    '<div class="lk-dots">'+Array.from({length:len},(_,i)=>'<i class="'+(i<PINBUF.length?'on':'')+'"></i>').join('')+'</div><div class="lk-msg">'+esc(msg||'')+'</div>'+
    '<div class="lk-pad">'+['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k===''?'<span></span>':'<button data-k="'+k+'" aria-label="'+(k==='⌫'?'Delete':k)+'">'+k+'</button>').join('')+'</div>'+
    '<button class="lk-forgot" data-k="forgot">Forgot PIN?</button></div>';
}
function showLock(){if(!lockOn())return;LOCKED=true;PINBUF='';$('lock').classList.remove('hide');renderLock('');}
function hideLock(){LOCKED=false;PINBUF='';$('lock').classList.add('hide');$('lock').innerHTML='';}
async function lockSubmit(){
  const w=lockWait();if(w){PINBUF='';renderLock('Too many wrong tries. Wait '+w+' seconds.');return;}
  const pin=PINBUF;
  let good=false;try{good=await pinCheck(pin);}catch(e){}
  if(good){localStorage.removeItem('pinf');hideLock();return;}
  const f=pinFail();f.n=(f.n||0)+1;
  if(f.n>=5)f.until=Date.now()+(f.n>=10?300000:30000);
  localStorage.setItem('pinf',JSON.stringify(f));
  PINBUF='';renderLock(f.n>=5?'Too many wrong tries. Wait '+lockWait()+' seconds.':'Wrong PIN. Try again.');
}
function lockKey(k){
  if(!LOCKED)return;
  const len=Number(localStorage.getItem('pinl'))||4;
  if(k==='forgot'){PINBUF='';renderLock('Open your personal link again (the one you were sent). That removes the lock on this phone, then you can set a new PIN from the menu.');return;}
  if(k==='⌫'||k==='Backspace'){PINBUF=PINBUF.slice(0,-1);renderLock('');return;}
  if(!/^\d$/.test(k)||PINBUF.length>=len)return;
  PINBUF+=k;renderLock('');
  if(PINBUF.length===len)lockSubmit();
}
$('lock').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)lockKey(b.dataset.k);});
document.addEventListener('keydown',e=>{if(LOCKED&&(/^\d$/.test(e.key)||e.key==='Backspace'))lockKey(e.key);});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return;}
  if(lockOn()&&!LOCKED&&hiddenAt&&Date.now()-hiddenAt>60000)showLock();   // lock again after a minute away
});
function openLockSettings(){
  if(!lockOK()){$('sheet').innerHTML='<h2>App lock</h2><div class="sub">This browser cannot keep a PIN safely, so the app lock is not available here.</div><button class="full ghost" data-pl="close">Close</button>';$('ov').style.display='flex';return;}
  const on=lockOn();
  $('sheet').innerHTML='<h2>App lock</h2><div class="sub" style="margin-bottom:6px">Ask for a PIN whenever Hisab opens, or comes back after a minute away. The PIN stays on this phone only and is never sent anywhere. Your name on the lock screen comes from your personal link.</div>'+
    (on?'<button class="full" data-pl="now">Lock now</button><button class="full ghost" data-pl="change">Change PIN</button><button class="full danger" data-pl="off">Turn off</button>':'<button class="full" data-pl="set">Set a PIN</button>')+
    '<button class="full ghost" data-pl="close">Close</button>';
  $('ov').style.display='flex';
}
$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-pl]');if(!b)return;const a=b.dataset.pl;
  const okPin=v=>/^\d{4,6}$/.test(v);
  const msgBad='Use 4 to 6 digits';
  if(a==='close')closeModal();
  else if(a==='now'){closeModal();showLock();}
  else if(a==='set')modal({title:'Set a PIN',saveText:'Turn on',fields:[{id:'p1',label:'Choose a PIN (4 to 6 digits)',type:'password',value:''},{id:'p2',label:'Type it again',type:'password',value:''}],
    save:async(v,bb)=>{if(!okPin(v.p1))return toast(msgBad,true);if(v.p1!==v.p2)return toast('The two PINs do not match',true);await pinSet(v.p1);closeModal();toast('App lock is on');buildDrawer();}});
  else if(a==='change')modal({title:'Change PIN',saveText:'Change',fields:[{id:'c',label:'Current PIN',type:'password',value:''},{id:'p1',label:'New PIN (4 to 6 digits)',type:'password',value:''},{id:'p2',label:'New PIN again',type:'password',value:''}],
    save:async(v,bb)=>{if(!(await pinCheck(v.c).catch(()=>false)))return toast('Current PIN is wrong',true);if(!okPin(v.p1))return toast(msgBad,true);if(v.p1!==v.p2)return toast('The two PINs do not match',true);await pinSet(v.p1);closeModal();toast('PIN changed');}});
  else if(a==='off')modal({title:'Turn off app lock',saveText:'Turn off',fields:[{id:'c',label:'Current PIN',type:'password',value:''}],
    save:async(v,bb)=>{if(!(await pinCheck(v.c).catch(()=>false)))return toast('Current PIN is wrong',true);['pinh','pins','pinl','pinf'].forEach(k=>localStorage.removeItem(k));closeModal();toast('App lock is off');buildDrawer();}});
});

// ---------- start
function init(r){
  Object.assign(S,r);
  ROLE=S.role||ROLE;OWNER=ROLE==='owner';
  S.me=S.name||S.me;
  if(S.name)localStorage.setItem('bn',S.name);
  S.people=S.people||[];S.members=S.members||[];S.fgoals=S.fgoals||[];
  if(!S.groups||!S.groups.expenses)S.groups={expenses:[],summary:{},history:[]};
  if(!S.ledger||!S.ledger.open)S.ledger={people:S.people,open:[],settled:[]};
  $('boot').style.display='none';
  if(!$('date').value)$('date').value=today();
  if(!inited){inited=true;nav.sec=OWNER?'home':'split';}
  if(OWNER){
    const cv=$('cat').value;
    $('cat').innerHTML=S.categories.map(c=>'<option>'+esc(c)+'</option>').join('');
    if(cv&&S.categories.indexOf(cv)>=0)$('cat').value=cv;
  }
  getQ().forEach(it=>applyLocal(it.action,it.payload));
  render();updateBar();
}
if(lockOn())showLock();
if(LOCK_RESET)setTimeout(()=>toast('The app lock on this phone was removed. Set a new PIN from the menu (App lock).'),2400);
if(!KEY){$('boot').textContent='Open your personal link once (the one ending in ?k=...). After that the app remembers you.';}
else{
  const c=localStorage.getItem('bc');
  if(c){try{init(JSON.parse(c));}catch(e){}}
  if(getQ().length)flush();else call('boot',{},init,null,'bc');
}
window.addEventListener('online',()=>{updateBar();flush();});
window.addEventListener('offline',updateBar);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&KEY){if(getQ().length)flush();else refresh();}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
updateBar();
// cover screen: plays once per launch, then fades out
setTimeout(()=>{const sp=$('splash');if(!sp)return;sp.classList.add('out');setTimeout(()=>sp.remove(),600);},(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)?500:1900);
</script>
</body>
